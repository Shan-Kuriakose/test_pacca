[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reusable-ai-game-template"
version = "0.1.0"
description = "Modular scaffold of game-core, difficulty-ai and event-instrumentation for reuse as an AI project template."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.coverage.run]
source = ["packages"]

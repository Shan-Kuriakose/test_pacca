# difficulty-ai implements the AdaptiveDifficulty port as a standalone module:
# it imports nothing from game-core, so a future project can swap its strategy
# without carrying the engine along.
[project]
name = "difficulty-ai"
version = "0.1.0"
description = "Adaptive implementations of the difficulty port; the swap point for a future project's model."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
